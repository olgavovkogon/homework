<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #1e2a3a, #3a2a4a);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 16px;
}

.calculator {
  width: 100%;
  max-width: 340px;
  background: #222831;
  border-radius: 24px;
  padding: 20px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}

.display {
  background: #1a1f26;
  border-radius: 16px;
  padding: 16px 20px;
  margin-bottom: 20px;
  text-align: right;
  color: #fff;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  overflow: hidden;
}

.expression {
  font-size: 18px;
  color: #8a94a6;
  min-height: 24px;
  word-break: break-all;
}

.result {
  font-size: 40px;
  font-weight: 300;
  word-break: break-all;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.btn {
  aspect-ratio: 1;
  border: none;
  border-radius: 50%;
  font-size: 24px;
  background: #393e46;
  color: #fff;
  cursor: pointer;
  transition: filter 0.15s, transform 0.05s;
}

.btn:hover { filter: brightness(1.2); }
.btn:active { transform: scale(0.95); }

.btn.func { background: #4f5866; }
.btn.op { background: #ff9f43; }
.btn.op.active { background: #fff; color: #ff9f43; }
.btn.equals { background: #00adb5; }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn func" data-action="clear">C</button>
      <button class="btn func" data-action="backspace">⌫</button>
      <button class="btn func" data-action="percent">%</button>
      <button class="btn op" data-op="/">÷</button>

      <button class="btn" data-num="7">7</button>
      <button class="btn" data-num="8">8</button>
      <button class="btn" data-num="9">9</button>
      <button class="btn op" data-op="*">×</button>

      <button class="btn" data-num="4">4</button>
      <button class="btn" data-num="5">5</button>
      <button class="btn" data-num="6">6</button>
      <button class="btn op" data-op="-">−</button>

      <button class="btn" data-num="1">1</button>
      <button class="btn" data-num="2">2</button>
      <button class="btn" data-num="3">3</button>
      <button class="btn op" data-op="+">+</button>

      <button class="btn func" data-action="negate">±</button>
      <button class="btn" data-num="0">0</button>
      <button class="btn" data-action="decimal">.</button>
      <button class="btn equals" data-action="equals">=</button>
    </div>
  </div>
  <script>
// Простий калькулятор на JavaScript

class Calculator {
  constructor(expressionEl, resultEl) {
    this.expressionEl = expressionEl;
    this.resultEl = resultEl;
    this.clear();
  }

  clear() {
    this.current = '0';      // число, яке зараз вводиться
    this.previous = null;    // попереднє число
    this.operator = null;    // обрана операція
    this.resetNext = false;  // чи почати нове число при наступному вводі
    this.update();
  }

  inputDigit(digit) {
    if (this.current === 'Помилка') this.clear();
    if (this.resetNext) {
      this.current = digit;
      this.resetNext = false;
    } else {
      this.current = this.current === '0' ? digit : this.current + digit;
    }
    this.update();
  }

  inputDecimal() {
    if (this.resetNext || this.current === 'Помилка') {
      this.current = '0.';
      this.resetNext = false;
    } else if (!this.current.includes('.')) {
      this.current += '.';
    }
    this.update();
  }

  backspace() {
    if (this.resetNext || this.current === 'Помилка') return;
    this.current = this.current.length > 1 ? this.current.slice(0, -1) : '0';
    if (this.current === '-') this.current = '0';
    this.update();
  }

  negate() {
    if (this.current === '0' || this.current === 'Помилка') return;
    this.current = this.current.startsWith('-')
      ? this.current.slice(1)
      : '-' + this.current;
    this.update();
  }

  percent() {
    if (this.current === 'Помилка') return;
    this.current = String(Calculator.round(parseFloat(this.current) / 100));
    this.update();
  }

  chooseOperator(op) {
    if (this.current === 'Помилка') return;
    // Якщо вже є операція і введено нове число — спочатку обчислюємо
    if (this.operator && !this.resetNext) {
      this.compute();
      if (this.current === 'Помилка') return;
    }
    this.previous = parseFloat(this.current);
    this.operator = op;
    this.resetNext = true;
    this.update();
  }

  compute() {
    if (this.operator === null || this.previous === null) return;
    const a = this.previous;
    const b = parseFloat(this.current);
    let result;

    switch (this.operator) {
      case '+': result = a + b; break;
      case '-': result = a - b; break;
      case '*': result = a * b; break;
      case '/':
        result = b === 0 ? null : a / b;
        break;
    }

    this.current = result === null ? 'Помилка' : String(Calculator.round(result));
    this.previous = null;
    this.operator = null;
    this.resetNext = true;
    this.update();
  }

  // Прибираємо похибки на кшталт 0.1 + 0.2 = 0.30000000000000004
  static round(num) {
    return parseFloat(num.toPrecision(12));
  }

  static symbol(op) {
    return { '+': '+', '-': '−', '*': '×', '/': '÷' }[op];
  }

  update() {
    this.resultEl.textContent = this.current;
    this.expressionEl.textContent =
      this.operator !== null ? `${this.previous} ${Calculator.symbol(this.operator)}` : '';

    document.querySelectorAll('.btn.op').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.op === this.operator && this.resetNext);
    });
  }
}

const calc = new Calculator(
  document.getElementById('expression'),
  document.getElementById('result')
);

// Обробка натискань кнопок
document.querySelector('.buttons').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;

  if (btn.dataset.num !== undefined) return calc.inputDigit(btn.dataset.num);
  if (btn.dataset.op) return calc.chooseOperator(btn.dataset.op);

  switch (btn.dataset.action) {
    case 'clear': calc.clear(); break;
    case 'backspace': calc.backspace(); break;
    case 'percent': calc.percent(); break;
    case 'negate': calc.negate(); break;
    case 'decimal': calc.inputDecimal(); break;
    case 'equals': calc.compute(); break;
  }
});

// Підтримка клавіатури
document.addEventListener('keydown', (e) => {
  const key = e.key;
  if (/^[0-9]$/.test(key)) calc.inputDigit(key);
  else if (key === '.' || key === ',') calc.inputDecimal();
  else if (['+', '-', '*', '/'].includes(key)) { e.preventDefault(); calc.chooseOperator(key); }
  else if (key === 'Enter' || key === '=') { e.preventDefault(); calc.compute(); }
  else if (key === 'Backspace') calc.backspace();
  else if (key === 'Escape' || key.toLowerCase() === 'c') calc.clear();
  else if (key === '%') calc.percent();
});
  </script>
</body>
</html>
